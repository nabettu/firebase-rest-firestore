name: Test

on:
  pull_request:
    branches:
      - main

# Least-privilege: this job only reads the repo.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      # 既知の悪性パッケージを install 前に止める（Takumi Guard。匿名モードでシークレット不要）
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      # --ignore-scripts blocks postinstall supply-chain attacks; the unit
      # tests are pure and need no native build steps.
      - name: Install
        run: npm ci --ignore-scripts

      # Dependency-free unit tests only. The emulator/credential-backed
      # integration suite runs in the release workflow, not on PRs.
      - name: Unit tests
        run: npm run test:unit
