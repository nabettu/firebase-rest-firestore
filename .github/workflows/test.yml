name: Test

on:
  pull_request:
    branches:
      - main

# Least-privilege: this job only reads the repo.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      # 既知の悪性パッケージを install 前に止める（Takumi Guard。匿名モードでシークレット不要）
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      # --ignore-scripts blocks postinstall supply-chain attacks; the unit
      # tests are pure and need no native build steps.
      - name: Install
        run: npm ci --ignore-scripts

      # Firestore エミュレータ用（firebase-tools 15 は Java 21 以上が必要）
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # エミュレータの CLI。バージョンは固定（publish から 14 日経ったものに上げる）
      - name: firebase-tools のインストール
        run: npm install -g firebase-tools@15.34.0 --ignore-scripts

      # Unit tests plus the integration suite against the Firestore emulator.
      - name: Tests (Firestore emulator)
        run: npm run test:emulator:ci
