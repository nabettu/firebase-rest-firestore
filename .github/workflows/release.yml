name: Release

on:
  push:
    branches:
      - main
  # 手動実行(OIDC 設定確認・リトライ用)
  workflow_dispatch:

# GitHub Actionsの権限設定
permissions:
  contents: write
  issues: write
  pull-requests: write
  # npm Trusted Publishing (OIDC) に必要
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # 既知の悪性パッケージを install 前に止める（Takumi Guard。匿名モードでシークレット不要）
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      - name: Gitの設定
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # --ignore-scripts で postinstall 系サプライチェーン攻撃をブロック
      - name: インストール
        run: npm ci --ignore-scripts

      # Firestore エミュレータ用（firebase-tools 15 は Java 21 以上が必要）
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # エミュレータの CLI。バージョンは固定（publish から 14 日経ったものに上げる）
      - name: firebase-tools のインストール
        run: npm install -g firebase-tools@15.34.0 --ignore-scripts

      # 結合テストは Firestore エミュレータで回す（本物のプロジェクトは使わない）
      - name: テスト実行
        run: npm run test:emulator:ci

      # npm への認証は Trusted Publishing (OIDC) を使用。NPM_TOKEN は不要
      - name: リリース実行
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
