version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 攻撃版パッケージは公開後数時間〜数日で削除されるため、寝かせてから取り込む
    cooldown:
      default-days: 14
      semver-major-days: 30
      include: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
      include: ["*"]
